; Reference acquisition firmware for an ESP32 with an ADS1115 (docs/app/SETUP.md).
; Build:  pio run -e esp32dev        Upload:  pio run -e esp32dev -t upload
; The protocol and the acquisition loop are also built and tested on a computer: test/host/build-and-test.sh

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11

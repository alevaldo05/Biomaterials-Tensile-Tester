; Reference acquisition firmware for an ESP32 with an ADS1115 (docs/app/SETUP.md).
; The protocol, acquisition loop and ADS1115 driver are shared by every board and live in ../common (see ../README.md).
; Build:  pio run -e esp32dev        Upload:  pio run -e esp32dev -t upload
; The protocol and the acquisition loop are also built and tested on a computer: ../common/test/host/build-and-test.sh

[env:esp32dev]
; pinned to the version the GitHub build compiled with (the build prints what it resolved)
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 921600
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11
; the shared code in ../common, compiled as a library (its library.json leaves out test/)
lib_deps = symlink://../common

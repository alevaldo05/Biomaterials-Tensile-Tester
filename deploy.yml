name: Deploy site

# Publishes the site to GitHub Pages every time something is merged into main.
# "Run workflow" on the Actions tab publishes again without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two deploys overlap, the newest one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Copies the site into _site/, adds ?v=<commit> to CSS/JS links, and writes version.json.
      # The files in the repository are never changed. See scripts/build-site.sh.
      - name: Build site folder
        run: bash scripts/build-site.sh _site "${{ github.sha }}" "${{ github.run_id }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

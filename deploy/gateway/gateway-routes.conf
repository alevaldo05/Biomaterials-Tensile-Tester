# Shared by the HTTP and HTTPS servers (included from nginx.conf and https.conf.template).
# The one address people open. It sends /api/ to the back end, /app/ to the tester app, and everything else to the
# website. Service addresses are looked up on every request (not once at start), so the gateway starts without the
# others and keeps working while any one of them is restarted or replaced.
  absolute_redirect off;   # /app -> /app/ keeps the address and port the person used (8080 or 8443, not the container's 80/443)
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  proxy_connect_timeout 3s;
  client_max_body_size 64m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;

  set $api http://api:3000;
  set $app http://app:80;
  set $web http://web:80;

  location = /app { return 301 /app/; }
  location /app/ {
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass $app;
    error_page 502 504 = @unavailable;
  }
  location /api/ {
    proxy_pass $api;
    error_page 502 504 = @api_unavailable;   # the API itself was not reached; its own answers (including 503) pass through
  }
  location / {
    proxy_pass $web;
    error_page 502 504 = @unavailable;
  }
  location @api_unavailable {
    default_type application/json;
    return 503 '{"error":{"code":"api_unavailable","message":"The lab database is not reachable right now. Tests can still be recorded and downloaded."}}';
  }
  location @unavailable {
    default_type text/plain;
    return 503 "This part is being restarted or updated. Try again in a moment.\n";
  }

# Serves the built app. Its pages carry their own Content Security Policy; file names with a hash can be kept a long time.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
  location / { add_header Cache-Control no-cache; add_header X-Content-Type-Options nosniff always; try_files $uri /index.html; }
}

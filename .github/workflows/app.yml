# Checks for the tester app, the back end, the firmware code, and the containers. Publishes nothing:
# no image is pushed anywhere, and the website is still published only by deploy.yml.
name: App checks

on:
  push:
    branches: [main, tester-app]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Type checks, all tests (API on PostgreSQL, firmware code with a C++ compiler), website checks
        run: docker build -f deploy/test/Dockerfile .

  firmware-build:
    # Compile only: proves src/main.cpp builds and links for the ESP32. Nothing is flashed or published,
    # and it says nothing about the board, the wiring, or the tester's signal. The platform version is not
    # pinned yet: the step below prints what was used, and the pin is added from a run that passed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the PlatformIO command line (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/pio"
          "$RUNNER_TEMP/pio/bin/pip" install --quiet platformio==6.1.19
          echo "$RUNNER_TEMP/pio/bin" >> "$GITHUB_PATH"
      - name: Compile the firmware for the ESP32 (no upload)
        working-directory: firmware/esp32-ads1115
        run: |
          pio run -e esp32dev
          pio pkg list -e esp32dev

  containers:
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the service images (not published)
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          docker compose build
      - name: Make a throwaway certificate (not committed)
        working-directory: deploy
        run: ./make-cert.sh localhost 127.0.0.1
      - name: Start them and check each part through the gateway
        working-directory: deploy
        run: |
          sed -i "s/^BACKUP_FIRST_DELAY_SECONDS=.*/BACKUP_FIRST_DELAY_SECONDS=5/" .env
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/api/v1/health && break; sleep 2; done
          curl -fs -o /dev/null http://127.0.0.1:8080/
          curl -fs -o /dev/null http://127.0.0.1:8080/app/
          curl -fsk https://127.0.0.1:8443/api/v1/health
          curl -fsk -o /dev/null https://127.0.0.1:8443/app/
          docker compose stop api
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/app/)" = 200
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/app/)" = 200
      - name: Check the scheduled backup wrote a readable dump
        working-directory: deploy
        run: |
          for i in $(seq 1 30); do ls backups/tester-*.dump >/dev/null 2>&1 && break; sleep 2; done
          docker compose logs backup
          f=$(ls backups/tester-*.dump | tail -1)
          docker compose exec -T db pg_restore --list < "$f" | grep -q "dbname: tester"
      - name: Stop and clean up
        if: always()
        working-directory: deploy
        run: docker compose down -v

# Builds the Windows installer and the portable program of the tester app and attaches both (with SHA256SUMS.txt)
# to a DRAFT release. Nothing is published:
# a draft release is visible only to people who can change the repository, and only the owner publishes it.
# The installer is unsigned (a beta): Windows will warn before running it. Runs only when started by hand
# (Actions > Windows app > Run workflow) or when a tag starting with app-v is pushed.
name: Windows app

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

permissions:
  contents: read

concurrency:
  group: windows-app
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-2025
    permissions:
      contents: write   # only for the last step, which creates the draft release; no earlier step is given the token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checks before building (all tests, type checks, website checks)
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npx vitest run --exclude "apps/api/**" --exclude "packages/recording/test/firmware.test.ts"   # these two run on Linux in app.yml
          node scripts/check-site.js

      - name: Build the app's screens
        shell: bash
        run: npm run app:build

      - name: Build stamp (the line the app's Help screen shows)
        # The same line as Help in the built app: the version (apps/desktop/package.json), the commit, and the short
        # hash of the website files the app shares (scripts/shared-files.js). Compare it with an installed copy.
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          shared=$(node scripts/shared-files.js --short)
          line="Version ${version} · built from ${GITHUB_SHA:0:12} · shared website files ${shared}"
          grep -rqF "$shared" apps/tester/dist/assets || { echo "The built screens do not carry the shared files hash $shared"; exit 1; }
          echo "$line"
          echo "BUILD_LINE=$line" >> "$GITHUB_ENV"
          { echo "### Build stamp"; echo; echo "$line"; echo; node scripts/shared-files.js | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the Windows installer and the portable program (unsigned beta)
        shell: bash
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run prepare-ui
          npm run dist:win
          cd release
          ls -l
          for kind in setup portable; do
            n=$(ls *-beta-unsigned-"$kind".exe 2>/dev/null | wc -l)
            [ "$n" = 1 ] || { echo "Expected one *-beta-unsigned-$kind.exe, found $n"; exit 1; }
          done
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Start-up check of the built program
        # Starts the unpacked program, waits for its window, and confirms only the app's own screens (app://tester/)
        # are open. A failure stops the build before the draft release is made. It passed on a Windows runner
        # (run 2); it does not test USB, recording, or an installed copy.
        shell: bash
        working-directory: apps/desktop
        run: |
          exe=$(ls release/win-unpacked/*.exe | grep -v -i uninstall | head -1)
          echo "Checking: $exe"
          node smoke.cjs "$exe" 9333 90

      - name: Create a draft release (not published)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="app-v${version}-beta.${GITHUB_RUN_NUMBER}"; fi
          cat > notes.md <<NOTES
          Windows installer and portable program of the tester app, version ${version} (beta), built from ${GITHUB_SHA}.

          ${BUILD_LINE}
          (The app's Help screen shows the same line. Compare the last part with \`node scripts/shared-files.js\`.)

          - Unsigned: Windows SmartScreen will warn before running them.
          - The portable .exe runs without installing; it has not been tried on a Windows computer.
          - Records from the acquisition device over USB serial. It sends no Start, STOP, Tare, speed, or position command to the tester.
          - The hardware connection is untested.
          - Check the download against SHA256SUMS.txt.

          This is a draft. It is published only by the owner.
          NOTES
          gh release create "$tag" --draft --prerelease --target "${GITHUB_SHA}" --title "Tester app ${version} (Windows, beta)" --notes-file notes.md \
            apps/desktop/release/*.exe apps/desktop/release/SHA256SUMS.txt
